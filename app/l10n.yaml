# gen-l10n (DESIGN_SYSTEM 10): one English ARB file now; Kurdish (Sorani) and
# Arabic are a translation task later, not a refactor. The generated Dart is
# committed, like every other generated file in this repository.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/core/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
format: true
# gen-l10n adds `// ignore_for_file: type=lint` itself. Its delegate list still
# names the bundled flutter_localizations delegates that D-22 deprecates; the
# app passes the material_ui ones instead (app.dart), so the deprecation info
# in this generated file is silenced here.
header: |-
  // Generated by `flutter gen-l10n` from lib/l10n/app_en.arb. Do not edit.
  // ignore_for_file: deprecated_member_use
