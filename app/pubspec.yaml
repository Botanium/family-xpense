name: xpense_app
description: Family Xpense, a household money app for two partners (iOS first).
publish_to: none
version: 0.1.0+1

# Toolchain: Flutter 3.50.1 / Dart 3.14.0, pinned in /.fvmrc.
# Version policy (WP-00): packages at 1.0 or above use a caret range from the
# version in the brief; pre-1.0 packages are pinned exactly because minor
# bumps break them. pubspec.lock is committed and is the real pin.
# Which layer may import which package is enforced by
# test/architecture/import_rules_test.dart (ARCHITECTURE 3.1 and 3.2).
environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  # Generative UI, A2UI v1.0 (L-11). Pre-1.0; only lib/a2ui/.
  a2ui_core: 0.8.0
  a2ui_flutter: 0.4.0
  # Testable time (ARCHITECTURE 3.2); already resolved through xpense_shared.
  clock: ^1.1.3
  # Firebase client (L-12). Firestore only in lib/data/ and the root.
  cloud_firestore: ^7.2.0
  # Rule ids hash the full pattern (WP-34); the server uses it too.
  crypto: ^3.0.8
  # Standalone Cupertino and Material libraries (D-22).
  cupertino_ui: ^1.1.7
  firebase_analytics: ^13.1.0
  firebase_app_check: 0.5.2
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  firebase_messaging: ^17.1.0
  firebase_remote_config: ^7.1.0
  firebase_storage: ^14.1.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  # On-device AI (L-13). Only lib/services/.
  flutter_edge_ai: ^2.7.1
  flutter_localizations:
    sdk: flutter
  # State and routing (L-10).
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  # The cloud agent client, remoteAgent (WP-34, ARCHITECTURE 3.2). The agent
  # API is experimental in 1.0; only lib/services/agent_client_remote.dart.
  genkit: ^1.0.3
  go_router: ^18.1.4
  # Latin OCR and Android (D-08). Only lib/services/.
  google_mlkit_text_recognition: ^1.0.3
  # The HTTP client under remoteAgent, wrapped to read the trace header.
  # Already resolved through genkit. Only lib/services/.
  http: ^1.6.0
  intl: ^0.20.3
  # The Schema type of a2ui_core's component schemas (WP-31). Pre-1.0, the
  # version a2ui_core 0.8.0 resolves; only lib/a2ui/.
  json_schema_builder: 0.1.7
  # Liquid Glass (D-07). Only GlassSurface in lib/core/.
  liquid_glass_widgets: ^1.19.0
  local_auth: ^3.0.2
  material_ui: ^1.11.1
  # Local settings store (WP-10). Only lib/services/. Already in the build
  # through flutter_edge_ai, so no new native code.
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  # Shared pure-Dart core. Path dependency; no pub workspace, because the app
  # and the server need different a2ui_core versions (D-05).
  xpense_shared:
    path: ../packages/xpense_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-simulator tests against the Firebase emulator suite (WP-11);
  # `flutter test integration_test -d <simulator>`. Not run by CI.
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # iOS flavors (DECISIONS D-44, ENVIRONMENTS 3.7): `dev` is
  # com.bitrelia.familyxpense.dev for development and TestFlight; `prod` is
  # the reserved App Store id. Plain `flutter run` builds `dev`.
  default-flavor: dev
  uses-material-design: true
  # gen-l10n (l10n.yaml): lib/l10n/app_en.arb -> lib/core/l10n/generated/.
  generate: true
  # Signal design system (WP-03, DESIGN_SYSTEM 4): bundled, never fetched.
  # Geist v1.9.2 from github.com/vercel/geist-font, SIL OFL 1.1.
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist_mono/GeistMono-Light.ttf
          weight: 300
        - asset: assets/fonts/geist_mono/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist_mono/GeistMono-Medium.ttf
          weight: 500
