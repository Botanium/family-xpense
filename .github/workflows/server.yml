# server/: format, codegen freshness, analyze, test (incl. import rules).
name: server

on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/**
      - packages/xpense_shared/**
      - analysis_options.yaml
      - .fvmrc
      - .github/workflows/server.yml
  push:
    branches: [main]
    paths:
      - server/**
      - packages/xpense_shared/**
      - analysis_options.yaml
      - .fvmrc
      - .github/workflows/server.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Dependencies (lockfile enforced)
        run: dart pub get --enforce-lockfile
      - name: Codegen is up to date
        run: |
          if grep -q '^  build_runner:' pubspec.yaml; then
            dart run build_runner build
            git diff --exit-code -- .
          else
            echo "No build_runner yet; skipping."
          fi
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Import rules
        run: dart test test/architecture
      - name: Test
        run: dart test --test-randomize-ordering-seed=random
