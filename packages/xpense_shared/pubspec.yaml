name: xpense_shared
description: Pure Dart core shared by the Family Xpense app and server (money, FX, digits, parser, schemas, taxonomy, catalog JSON).
publish_to: none
version: 0.1.0

# Must stay pure Dart: no Flutter, dart:io, Firebase or a2ui_core
# (ARCHITECTURE 2, D-05). Enforced by test/architecture/purity_test.dart.
environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  decimal: ^3.2.6
  meta: ^1.19.0
  schemantic: ^1.0.0

dev_dependencies:
  build_runner: ^2.16.2
  # Catalog parity on the server side (WP-31): the catalog JSON must load
  # with genkit_a2ui's loadCatalog and compile Express. Dev only, so the app
  # (a2ui_core 0.8) and the server (0.7) keep their own resolution (D-05).
  genkit: ^1.0.3
  genkit_a2ui: 0.6.0
  schemantic_builder: ^1.0.0
  test: ^1.33.0
  very_good_analysis: ^11.0.0
  yaml: ^3.1.3
