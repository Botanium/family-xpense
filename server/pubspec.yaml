name: xpense_agent
description: Family Xpense agent service (Genkit Dart on Cloud Run). One image, two services (D-17).
publish_to: none
version: 0.1.0

# Toolchain: Dart 3.14.0 (the SDK bundled with Flutter 3.50.1, see /.fvmrc).
# Version policy (WP-00): packages at 1.0 or above use a caret range from the
# version in the brief; pre-1.0 packages are pinned exactly because minor
# bumps break them. pubspec.lock is committed and is the real pin.
# Pre-1.0 packages are imported only in their module; enforced by
# test/architecture/import_rules_test.dart.
environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  # OpenTelemetry SDK that genkit_otel plugs into (D-29). Only lib/telemetry/.
  # genkit_otel 0.2.3 requires ^0.11.0, so 0.12.0 (ARCHITECTURE 4.3) cannot
  # resolve.
  dartastic_opentelemetry: 0.11.0
  # Exact amount comparison in the agent tools and output guard (WP-32).
  decimal: ^3.2.6
  # ID token, App Check, Firestore, Messaging; replaces firebase_admin (D-06).
  # Only lib/admin/.
  firebase_admin_sdk: 0.5.6
  # Genkit Dart 1.0 (L-15).
  genkit: ^1.0.3
  genkit_a2ui: 0.6.0
  # FirestoreSessionStore (D-31). Only lib/runtime/.
  genkit_google_cloud: 0.3.3
  genkit_google_genai: ^1.2.0
  # Production telemetry over OTLP (D-29). Only lib/telemetry/.
  genkit_otel: 0.2.3
  genkit_shelf: ^1.0.3
  # The Firestore client firebase_admin_sdk returns (FieldValue, Timestamp).
  # Only lib/admin/ and lib/runtime/.
  google_cloud_firestore: 0.5.4
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.19.0
  schemantic: ^1.0.0
  # Request logging and /healthz around the GenkitRouter (ARCHITECTURE 4.3).
  shelf: ^1.4.3
  # Shared pure-Dart core. Path dependency, separate lockfile (D-05).
  xpense_shared:
    path: ../packages/xpense_shared

dev_dependencies:
  # schemantic codegen for the tool schemas (lib/tools/, WP-32).
  build_runner: ^2.16.2
  schemantic_builder: ^1.0.0
  test: ^1.33.0
  very_good_analysis: ^11.0.0
